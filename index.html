<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ImageCare ERP - Business management system" />
    <title>ImageCare ERP</title>
    <!--
      Counterpart to public/404.html: if GitHub Pages redirected here
      because the original request was for a deep in-app route (e.g.
      a refresh on /IMAGE-CARE/dashboard), restore that real path
      before React Router's basename-aware routes ever mount, so the
      app opens on the route that was actually requested instead of
      always bouncing to the dashboard.
      https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(
            null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
