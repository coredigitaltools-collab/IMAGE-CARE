<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Bug fix (2026-09-12, "set the app up as a PWA"): these used to be
      hardcoded root-absolute paths (e.g. "/favicon.svg"). Vite does NOT
      rewrite plain "/..." paths in index.html to include the deploy base
      path - only the script/stylesheet tags it manages itself get that
      treatment. "%BASE_URL%" is Vite's own placeholder for exactly this -
      it always resolves to whatever `base` is set to in vite.config.mts,
      in both dev and production, so these links stay correct no matter
      where the app is deployed. (2026-09-13: `base` moved from
      '/IMAGE-CARE/', the old GitHub Pages project-site subpath, to '/',
      since the app is now served from the root of its own custom domain
      - that old github.io link is retired.)
    -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ImageCare" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ImageCare - Business management system" />
    <title>ImageCare</title>
    <!--
      Counterpart to public/404.html: if GitHub Pages redirected here
      because the original request was for a deep in-app route (e.g.
      a refresh on /IMAGE-CARE/dashboard), restore that real path
      before React Router's basename-aware routes ever mount, so the
      app opens on the route that was actually requested instead of
      always bouncing to the dashboard.
      https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(
            null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
